name: Feature request
description: Suggest a flow, provider or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The API, event or dashboard change you have in mind. Remember that Bogts reports payment facts and leaves entitlement to your app.
    validations:
      required: true
  - type: textarea
    id: provider
    attributes:
      label: Provider details
      description: If this needs a provider API, link its docs or describe what it sends. No credentials.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
